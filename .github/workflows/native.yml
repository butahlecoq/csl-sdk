name: SDK and research consumer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - name: Check dependency archive integrity
        run: python -m unittest discover -s tests/cmake -p test_dependency_archive.py
      - name: Build and test the SDK and installed examples
        run: |
          cmake -S . -B build/sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/sdk --parallel 4
          ctest --test-dir build/sdk --output-on-failure --no-tests=error --parallel 2
          cmake --install build/sdk --prefix "$RUNNER_TEMP/csl-sdk"
      - name: Check out the research consumer at its reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: butahlecoq/controlled-systems-lab
          ref: 7246c67daab1fb4cc634ba73fbbf2a457691c679
          path: research
          persist-credentials: false
          sparse-checkout: |
            benchmarks/CMakeLists.txt
            benchmarks/reporting/exp824/
            scripts/reports/exp824/check_nominal.py
          sparse-checkout-cone-mode: false
      - name: Build and independently check the downstream research result
        run: |
          sdk_version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/sdk/CMakeCache.txt)
          test -n "$sdk_version"
          cmake -S research/benchmarks -B build/research -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/csl-sdk" "-DCSL_RESEARCH_SDK_VERSION=$sdk_version"
          cmake --build build/research --parallel 2
          ctest --test-dir build/research --output-on-failure --no-tests=error
  sdk-profiles:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: MSVC x64, os: windows-2022, preset: dev-windows, cc: cl, cxx: cl }
          - { compiler: Clang 18, os: ubuntu-24.04, preset: dev, cc: clang-18, cxx: clang++-18 }
          - { compiler: GCC 13, os: ubuntu-24.04, preset: core, cc: gcc-13, cxx: g++-13 }
          - { compiler: GCC 13, os: ubuntu-24.04, preset: highs, cc: gcc-13, cxx: g++-13 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error

  casadi-strategies:
    name: Real IPOPT through both control strategies
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Configure the solver-enabled SDK
        run: |
          python -m pip install -r requirements-cpp-quality.txt casadi==3.8.0
          casadi_dir=$(python -c 'from pathlib import Path; import casadi; print(Path(casadi.__file__).resolve().parent / "cmake")')
          cmake -S . -B build/strategies -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCSL_ENABLE_CASADI=ON -DCSL_ENABLE_HIGHS=ON -DCSL_ENABLE_QHULL=ON "-Dcasadi_DIR=$casadi_dir"
      - name: Build both strategy suites and the native policy bridge
        run: >-
          cmake --build build/strategies --parallel 4
          --target strategy_a_tests direct_joint_strategy_tests csl_closed_loop_native_policy
      - name: Run typed strategy suites and the five-family bridge regression
        run: |
          ctest --test-dir build/strategies -R '^(strategy_a_tests|direct_joint_strategy_tests)$' --output-on-failure --no-tests=error
          ctest --test-dir build/strategies -R '^native_history_feedback_bridge$' --output-on-failure --no-tests=error
      - name: Analyze the solver-enabled native policy bridge
        run: >-
          clang-tidy -p build/strategies --config-file=.clang-tidy
          --quiet tools/closed_loop_native_policy.cpp
