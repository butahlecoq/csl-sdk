name: SDK and research consumer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - name: Build and test the SDK and installed examples
        run: |
          cmake -S . -B build/sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/sdk --parallel 4
          ctest --test-dir build/sdk --output-on-failure --no-tests=error --parallel 2
          cmake --install build/sdk --prefix "$RUNNER_TEMP/csl-sdk"
      - name: Check out the research consumer at its reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: butahlecoq/controlled-systems-lab
          ref: 118048a213a20b9401455b167cb7e9d853f94c9c
          path: research
          persist-credentials: false
          sparse-checkout: |
            benchmarks/CMakeLists.txt
            benchmarks/reporting/exp824/
            scripts/reports/exp824/check_nominal.py
          sparse-checkout-cone-mode: false
      - name: Build and independently check the downstream research result
        run: |
          cmake -S research/benchmarks -B build/research -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/csl-sdk"
          cmake --build build/research --parallel 2
          ctest --test-dir build/research --output-on-failure --no-tests=error
